    <div id="page-presentation" class="page active page-presentation-view">
        <div class="presentation-container">
            <!-- Colonne Principale : Diaporama & Audio Synchronisé -->
            <div class="presentation-main">
                <div class="presentation-header-toolbar">
                    <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
                        <button onclick="navigateTo('consultation')" class="back-btn" style="margin-bottom: 0; padding: 6px 12px; font-size: 13px; flex-shrink: 0;">← Catalogue</button>
                        <h2 id="presentation-title" style="margin: 0; font-size: 16px; color: #0f172a; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Titre de la formation</h2>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex-shrink: 0;">
                        <a id="presentation-download-pdf" href="#" download class="action-btn-sm" style="background: #f1f5f9; color: #000000; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; padding: 5px 10px; border-radius: 6px; font-size: 12px;" title="Télécharger le support de cours (PDF)">Support PDF</a>
                        <a id="presentation-download-pptx" href="#" download class="action-btn-sm" style="background: #f8fafc; color: #e9041e; text-decoration: none; display: none; align-items: center; gap: 4px; font-weight: 700; padding: 5px 10px; border-radius: 6px; font-size: 12px;" title="Télécharger la présentation PowerPoint (PPTX)">Support PPTX</a>
                        <button id="presentation-prev" class="action-btn-sm" style="padding: 5px 10px; font-weight: 700; font-size: 12px;">◀ Précédent</button>
                        <span id="presentation-page-info" style="font-weight: 700; font-size: 12.5px; color: #334155; min-width: 55px; text-align: center;">1 / 1</span>
                        <button id="presentation-next" class="action-btn-sm" style="padding: 5px 10px; font-weight: 700; font-size: 12px;">Suivant ▶</button>
                        <div style="display: inline-flex; align-items: center; gap: 4px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 3px 8px;" title="Vitesse de lecture de la présentation">
                            <span style="font-size: 11px; font-weight: 700; color: #475569;">Vitesse :</span>
                            <select id="presentation-speed-select" onchange="changePresentationSpeed(this.value)" style="border: none; background: transparent; font-size: 12px; font-weight: 700; color: #0f172a; cursor: pointer; outline: none;">
                                <option value="0.25">0.25x</option>
                                <option value="0.5">0.5x</option>
                                <option value="0.75">0.75x</option>
                                <option value="1.0" selected>1.0x</option>
                                <option value="1.25">1.25x</option>
                                <option value="1.5">1.5x</option>
                                <option value="1.75">1.75x</option>
                                <option value="2.0">2.0x</option>
                            </select>
                        </div>
                        <button id="presentation-stage-theme" onclick="togglePresentationStageTheme()" class="action-btn-sm" style="background: #f1f5f9; color: #334155; padding: 5px 10px; font-size: 12px;" title="Basculer entre fond clair et fond sombre">Fond</button>
                        <button id="presentation-eval-btn" onclick="startCurrentCourseEvaluation()" class="action-btn-sm" style="display: none; background: #e9041e; color: #ffffff; font-weight: 700; padding: 5px 12px; font-size: 12px; border: none; border-radius: 6px; cursor: pointer; align-items: center; gap: 4px;" title="Tester vos connaissances">Évaluation</button>
                        <button id="presentation-resume-btn" onclick="resumePresentationAudio()" class="action-btn-sm" style="display: none; background: #e9041e; color: white; font-weight: 700; padding: 5px 12px; font-size: 12px; border: none; border-radius: 6px; cursor: pointer; align-items: center; gap: 4px;" title="Reprendre l'explication audio de la présentation">Reprendre</button>
                        <button id="presentation-toggle-chat" class="action-btn-sm" style="background: #0f172a; color: white; padding: 5px 10px; font-size: 12px;">Afficher les questions</button>
                    </div>
                </div>

                <!-- Visualiseur PDF Maximisé -->
                <div class="presentation-pdf-box" id="presentation-pdf-box">
                    <div id="presentation-loading" style="color: #475569; font-size: 15px; font-weight: 600;">Chargement de la présentation...</div>
                    <canvas id="presentation-canvas"></canvas>
                    
                    <!-- Contrôles Flottants en Mode Plein Écran -->
                    <div class="fullscreen-controls-overlay" id="fullscreen-controls-overlay">
                        <button id="fs-btn-prev" class="fs-ctrl-btn" title="Diapositive précédente (←)">◀ Précédent</button>
                        <span id="fs-page-info" class="fs-page-info">1 / 1</span>
                        <button id="fs-btn-next" class="fs-ctrl-btn" title="Diapositive suivante (→)">Suivant ▶</button>
                        <button id="fs-btn-exit" class="fs-ctrl-btn fs-exit-btn" title="Quitter le plein écran (Échap)">Quitter</button>
                    </div>
                </div>

                <!-- Barre de progression de slide -->
                <div class="presentation-progress-wrapper">
                    <div id="presentation-progress-bar" style="background: #e9041e; height: 100%; width: 0%; transition: width 0.3s;"></div>
                </div>

                <!-- Lecteur Audio (Occupe tout l'espace disponible) -->
                <div class="presentation-audio-card">
                    <audio id="presentation-audio" controls style="width: 100%; height: 36px; border-radius: 6px;"></audio>
                    <span id="presentation-audio-status" style="display: none;"></span>
                </div>
            </div>

            <!-- Colonne Latérale : Assistant Chat (Texte & Voix) -->
            <div class="presentation-chat-side" id="presentation-chat-side">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 12px;">
                    <div>
                        <h3 style="margin: 0; font-size: 15px; color: #0f172a; font-weight: 800;">Questions sur la formation</h3>
                        <small style="color: #64748b; font-size: 11px;">Posez vos questions par texte ou par micro</small>
                    </div>
                    <button onclick="clearRagChatHistory()" title="Effacer l'historique" style="background: none; border: none; font-size: 14px; cursor: pointer; color: #94a3b8;">Effacer</button>
                </div>

                <div class="chat-history-box" id="presentation-chat-history">
                    <div class="chat-msg chat-msg-ai">
                        Bonjour ! Posez votre question sur cette formation par écrit ou au micro.
                    </div>
                </div>

                <!-- Zone d'envoi RAG -->
                <div style="display: flex; gap: 6px; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 12px;">
                    <button id="rag-mic-btn" style="background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; width: 38px; height: 38px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;" title="Maintenir pour parler"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg></button>
                    <input type="text" id="rag-chat-input" placeholder="Posez une question sur le cours..." style="flex: 1; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px;">
                    <button id="rag-chat-send" class="action-btn-sm" style="background: #e9041e; color: white; padding: 9px 14px; font-weight: 700;">Envoyer</button>
                </div>
                <audio id="rag-audio-player" style="display: none;" autoplay></audio>
            </div>
        </div>
    </div>

    <!-- Page Mode 3 : Évaluation Interactive & Diagnostic Pédagogique IA -->
